syntax = "proto3";

package vibe.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gallowaysoftware/vibe/proto/vibe/v1;vibev1";

// ControlService is the vibe daemon's control plane. The OpenAI-compatible
// inference proxy is a separate REST endpoint (its contract is fixed by
// upstream); everything here is for lifecycle management.
service ControlService {
  // Status returns the daemon's current state.
  rpc Status(StatusRequest) returns (StatusResponse) {}

  // ListProfiles enumerates the profiles vibe knows about.
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse) {}

  // Start activates the named profile. Returns once it's ready (or errors).
  rpc Start(StartRequest) returns (StartResponse) {}

  // Stop deactivates the currently-active profile. No-op if nothing active.
  rpc Stop(StopRequest) returns (StopResponse) {}

  // Shutdown asks the daemon to exit gracefully.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse) {}

  // Logs returns the most recent llama-server log lines. Streaming follow is
  // a future RPC.
  rpc Logs(LogsRequest) returns (LogsResponse) {}

  // Pull downloads the profile's model from HuggingFace if it isn't already
  // present locally. Returns a single PHASE_DONE message if the model is
  // already cached at the expected size, or a stream of PHASE_DOWNLOADING
  // updates while bytes flow in.
  rpc Pull(PullRequest) returns (stream PullProgress) {}
}

message Status {
  bool running = 1;
  bool ready = 2;
  string profile = 3;
  google.protobuf.Timestamp started_at = 4;
  string backend_addr = 5;
  string proxy_addr = 6;
  int32 pid = 7;
  // frontend_env carries the env vars the user should set when launching the
  // external frontend, so `vibe env` can echo them after the fact.
  map<string, string> frontend_env = 8;
  // parallel reports the active profile's llama_server `parallel` setting:
  // the number of concurrent inference slots the backend exposes. Zero when
  // no profile is active or the active profile uses a non-llama_server
  // backend (the parallel concept is llama-server-specific). Clients use
  // this to cap their own foreach/fan-out concurrency to the actual
  // back-pressure point instead of spinning N goroutines that all queue
  // on the same serialized inference slot.
  int32 parallel = 9;
}

message Profile {
  string name = 1;
  string description = 2;
  string path = 3;
}

message FrontendInfo {
  // Tag 1 used to carry `app` — a cosmetic display string echoed by the
  // CLI ("frontend: opencode (running)"). It was removed; the profile name
  // serves that role instead. The reserved declaration keeps the tag
  // permanently unused so a future field doesn't accidentally collide
  // with a stale on-the-wire `app` value.
  reserved 1;
  reserved "app";
  string wrote_file = 2;
  bool restart_required = 3;
  // env_vars the user should set when launching the external frontend.
  // Example: {"OPENCODE_CONFIG": "/home/.../state/vibe/frontend/code/opencode.json"}.
  map<string, string> env_vars = 4;
  // kind echoes profile.Frontend.Kind so the CLI can word its output
  // differently for external (config written, user launches binary) vs
  // managed/docker-compose (vibe also launched the binary).
  string kind = 5;
  // url is the address the user should open in their browser, derived
  // from profile.Frontend.BrowserURL() (explicit frontend.url field or
  // the wait_for entry with a "/" path). Empty when neither applies —
  // the CLI omits the browser hint in that case.
  string url = 6;
  // args is frontend.Args with ${VAR} placeholders already expanded (e.g.
  // ${MODEL_ALIAS} -> the resolved canonical model id). Only populated for
  // kind=managed foreground activations (`vibe run`) — that's the one path
  // where the CLI itself execs the binary and must not re-derive expansion
  // client-side (it doesn't have the daemon's ExpandContext).
  repeated string args = 7;
}

message StatusRequest {}
message StatusResponse {
  // status describes the currently-active profile (empty Status block
  // when no active profile is running). Backward-compatible with
  // pre-services clients that only knew about the single active slot.
  Status status = 1;
  // services lists every running service-mode profile. Service-mode
  // profiles run alongside one another and alongside the active
  // profile (each has its own supervisor instance + published port).
  repeated Status services = 2;
}

message ListProfilesRequest {}
message ListProfilesResponse {
  repeated Profile profiles = 1;
}

message StartRequest {
  string profile = 1;
  // no_vram_check, when true, skips the pre-flight VRAM check the daemon
  // performs against the profile's estimated_vram_gb. For users who know
  // their setup better than the heuristic.
  bool no_vram_check = 2;
  // foreground, when true, asks the daemon to render the frontend's config
  // file and expand its env, but NOT spawn the frontend binary. The caller
  // (typically `vibe run`) then exec's the binary in its own terminal so
  // TUI tools like opencode get attached stdio. The daemon ignores this
  // flag for kind=external (already config-only) and rejects it for
  // kind=docker-compose (compose is inherently supervised).
  bool foreground = 3;
  // backend activates a named backend definition (backends/<name>.yaml) as
  // the active model server with NO frontend — the model is the deliverable,
  // reached via the proxy. Used by vamp capability resolution so a pipeline
  // depends on a backend, not a frontend-bearing profile. Exactly one of
  // profile or backend must be set. The active identity is the backend name,
  // so repeated activations of the same backend are no-op reuse.
  string backend = 4;
}
message StartResponse {
  Status status = 1;
  FrontendInfo frontend = 2;
}

message StopRequest {
  // profile, if set, names the specific profile to stop. Service-mode
  // profiles must be addressed by name (e.g. `vibe stop searxng`)
  // since multiple can run concurrently. If empty, the daemon stops
  // the active profile (legacy single-profile behavior).
  //
  // The special value "all" stops the active profile and every
  // running service in one call — useful in shutdown / reset paths.
  string profile = 1;
}
message StopResponse {
  Status status = 1;
}

message ShutdownRequest {}
message ShutdownResponse {}

message LogsRequest {
  // profile, if set, requests logs for a specific service-mode
  // profile (matching its profile.name). Empty / "active" → the
  // active profile (legacy behavior).
  string profile = 1;
}
message LogsResponse {
  repeated string lines = 1;
}

message PullRequest {
  string profile = 1;
}

message PullProgress {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_RESOLVING = 1;   // HEAD request to HuggingFace to fetch metadata
    PHASE_DOWNLOADING = 2; // bytes flowing in
    PHASE_VERIFYING = 3;   // post-download size check
    PHASE_DONE = 4;        // final state
  }
  Phase phase = 1;
  int64 downloaded_bytes = 2;
  int64 total_bytes = 3;
  // human-readable message, e.g. "resuming from byte 1234567"
  string message = 4;
}
