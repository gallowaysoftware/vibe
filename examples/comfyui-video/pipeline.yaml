name: ltxv_video_smoke
description: |
  Single-stage vamp pipeline that submits an LTX-Video 2B workflow to
  ComfyUI and copies the resulting MP4 into the run dir. Demonstrates
  that the comfyui executor's NodeOutputs.Videos / collectOutputs path
  works against a real video-generating workflow.

  Requires:
    - vibe `comfyui` profile pointing at ~/ComfyUI
    - ~/ComfyUI/models/checkpoints/ltxv-2b-0.9.8-distilled-fp8.safetensors
    - ~/ComfyUI/models/text_encoders/t5xxl_fp8_e4m3fn.safetensors
  Both files are public on HuggingFace (Lightricks/LTX-Video and
  comfyanonymous/flux_text_encoders).

inputs:
  prompt:
    type: string
    required: true

stages:
  - id: render
    type: comfyui
    capability: image_gen
    workflow: workflows/ltxv_t2v.json
    parameters:
      "6.text": "{{.inputs.prompt}}"
    output: video.mp4
