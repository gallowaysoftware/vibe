name: video_pipeline_smoke
description: |
  Four-stage video assembly pipeline. text -> audio -> comfyui -> ffmpeg.
  Generates a short narration, synthesizes it with Piper TTS, renders a
  cover image with ComfyUI/SDXL-Turbo, then combines audio + image into
  final.mp4 with ffmpeg (looping the image for the audio duration).

inputs:
  topic:
    type: string
    required: true

stages:
  # 1. Draft a short narration for the topic. Capability "reasoning" maps to
  # any llama-server profile in capabilities.yaml.
  - id: script
    type: text
    capability: reasoning
    prompt: |
      Write a 2-sentence narration about {{.inputs.topic}}.
      Plain text only, no markdown, no preamble.
    output: script.txt
    params:
      max_tokens: 1024
      temperature: 0.5

  # 2. TTS the narration to .wav. Audio stages run as a subprocess and do
  # not activate a vibe profile.
  - id: voiceover
    type: audio
    voice: en_US-lessac-medium
    text: "{{.stages.script.output}}"
    inputs: [script]
    output: voiceover.wav

  # 3. Render a single illustrative image. The "image_gen" capability swaps
  # the active vibe profile to a ComfyUI backend.
  - id: render
    type: comfyui
    capability: image_gen
    inputs: [script]
    workflow: workflows/sdxl_turbo.json
    parameters:
      "4.text": "cinematic still illustrating: {{.inputs.topic}}"
      "7.seed": "42"
    output: cover.png

  # 4. Mux audio + still image into final.mp4. ffmpeg stages, like audio
  # stages, run as a subprocess; no profile is activated for this group.
  # The executor appends `-y final.mp4` (under the run dir) after the
  # listed args, so users don't manage the output path themselves.
  - id: assemble
    type: ffmpeg
    inputs: [voiceover, render]
    ffmpeg_args:
      - "-loop"
      - "1"
      - "-i"
      - "{{ .stages.render.output }}"
      - "-i"
      - "{{ .stages.voiceover.output }}"
      - "-c:v"
      - "libx264"
      - "-pix_fmt"
      - "yuv420p"
      - "-tune"
      - "stillimage"
      - "-c:a"
      - "aac"
      - "-b:a"
      - "192k"
      - "-shortest"
    output: final.mp4
