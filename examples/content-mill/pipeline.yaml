# content-mill: end-to-end demo pipeline showcasing every vamp stage type
# stacked together. Outputs a finished MP4 + a webhook ping announcing it.
#
# Stages:
#   script         - LLM writes a short narration (text)
#   cover          - LLM emits scene prompt as JSON (text, output_format: json)
#   render         - ComfyUI renders one cover image (comfyui, foreach over cover's 1-item JSON)
#   voice          - Piper TTS narrates the script (audio)
#   assemble       - ffmpeg muxes the cover image (looped) + narration into MP4
#   notify         - Slack/Discord/Mattermost webhook announces completion (webhook)
#   notify_failure - same channel, but only fires when an earlier stage
#                    fails (run_when: failure). Gives the operator a ping
#                    even when stage 3 of 7 explodes.
#
# Run:
#   vamp run examples/content-mill/pipeline.yaml --input topic="..."
#
# The notify stage reads its URL from $VAMP_SLACK_WEBHOOK. If unset, it
# POSTs to a literal "no-op://" URL which the executor rejects so the
# whole pipeline fails before the network call leaves the machine. Set
# the env var (or skip the notify stage) before running for real.

name: content_mill
description: text -> image -> TTS -> ffmpeg -> webhook end-to-end demo

inputs:
  topic:
    type: string
    required: true

stages:
  - id: script
    type: text
    capability: reasoning
    prompt: |
      Write exactly two sentences of narration for a short video about
      "{{.inputs.topic}}". Plain prose. No markdown, no titles, no
      numbered lists. Aim for ~30 spoken words total.
    output: script.txt
    params:
      max_tokens: 2048
      temperature: 0.4

  - id: cover
    type: text
    capability: reasoning
    inputs: [script]
    prompt: |
      Given this two-sentence narration:

      "{{.stages.script.output}}"

      Emit a JSON array with exactly ONE element shaped:
        [{"description": "<vivid still-image scene capturing the topic>", "seed": <integer>}]

      Keep description under 30 words; cinematic style; no people's
      faces. Seed is a positive integer. Output ONLY the JSON.
    output: cover.json
    output_format: json
    params:
      max_tokens: 4096
      temperature: 0.5

  - id: render
    type: comfyui
    capability: image_gen
    inputs: [cover]
    workflow: ../comfyui-image-batch/workflows/sdxl_turbo.json
    foreach: { from: cover, var: scene }
    parameters:
      "4.text": "{{.scene.description}}"
      "7.seed": "{{.scene.seed}}"
    output: cover_{{.i}}.png

  - id: voice
    type: audio
    inputs: [script]
    voice: en_US-lessac-medium
    text: "{{.stages.script.output}}"
    output: voice.wav

  - id: assemble
    type: ffmpeg
    inputs: [render, voice]
    # Stage outputs are now absolute paths so {{ .stages.X.output(s) }}
    # references resolve from the daemon's CWD; no need for the old
    # `{{ .runDir }}/` prefix workaround. ffmpeg's banner + libx264 stats
    # used to overflow the executor's stderr tail-ring with a short
    # write; that's been fixed too so we can keep the verbose default.
    ffmpeg_args:
      - "-loop"
      - "1"
      - "-framerate"
      - "25"
      - "-i"
      - "{{ index .stages.render.outputs 0 }}"
      - "-i"
      - "{{ .stages.voice.output }}"
      - "-map"
      - "0:v"
      - "-map"
      - "1:a"
      - "-c:v"
      - "libx264"
      - "-pix_fmt"
      - "yuv420p"
      - "-c:a"
      - "aac"
      - "-b:a"
      - "192k"
      - "-shortest"
    output: final.mp4

  - id: notify
    type: webhook
    inputs: [assemble]
    url: "{{ env \"VAMP_SLACK_WEBHOOK\" }}"
    body:
      text: "vamp content-mill done for '{{.inputs.topic}}'. Run dir: {{.runDir}}"
    output: webhook_response.txt

  # Failure-path notification. run_when: failure makes the executor
  # schedule this stage only when an earlier stage failed (and the
  # pipeline overall has the "failed" status). It does NOT declare
  # `inputs:` on the success-path stages, so it isn't blocked by them.
  # The {{ .failure_summary }} template binding is populated by the
  # executor with the first failed stage's id + error message.
  - id: notify_failure
    type: webhook
    run_when: failure
    url: "{{ env \"VAMP_SLACK_WEBHOOK\" }}"
    body:
      text: "vamp content-mill FAILED for '{{ .inputs.topic }}'. Stage: {{ .failure_summary }}."
    output: notify_failure.txt
