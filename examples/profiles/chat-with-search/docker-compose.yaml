# Open WebUI + SearXNG sidecar, wired to vibe's OpenAI-compatible
# proxy on 127.0.0.1:9000.
#
# `network_mode: host` shares the user's network namespace with the
# containers so they reach the proxy + each other through 127.0.0.1.
# Works under both Docker and rootless podman.
#
# Bind-mount paths come from the profile's frontend.env block:
#   VIBE_FRONTEND_STATE  ~/.local/state/vibe/frontend/chat
#   SEARXNG_CONFIG       the searxng/ dir bundled with this example
#
# Tier-1 RAG (in-process Chroma + BGE-M3 embeddings + reranker +
# hybrid search) is on. For Tier-2 (separate Qdrant + TEI containers)
# see the rag profile example.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: vibe-chat-webui
    network_mode: host
    environment:
      - OPENAI_API_BASE_URL=http://127.0.0.1:9000/v1
      - OPENAI_API_KEY=vibe-local
      - WEBUI_AUTH=False
      - ENABLE_OLLAMA_API=False
      - PORT=8080
      # Tier-1 RAG: BGE-M3 embeddings (CPU, in-process) + reranker.
      - RAG_EMBEDDING_ENGINE=
      - RAG_EMBEDDING_MODEL=BAAI/bge-m3
      - ENABLE_RAG_HYBRID_SEARCH=True
      - RAG_RERANKING_MODEL=BAAI/bge-reranker-v2-m3
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - RAG_TOP_K=5
      # Web search via SearXNG sidecar.
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://127.0.0.1:14001/search?q=<query>
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      # Open WebUI builds langchain's WebBaseLoader without a
      # header_template, so it inherits langchain's baked-in browser UA.
      # Wikipedia (and most anti-scraping WAFs) 403 that exact pattern
      # from an aiohttp client and return a 141-byte "respect our robot
      # policy" notice. Result: every scraped page is empty → Chroma
      # collection stays empty → model gets zero web context → answers
      # by hallucinating from training data even though SearXNG +
      # loader both "succeeded". sitecustomize.py (bind-mounted below)
      # monkeypatches the default UA from this env var to an
      # identifying one, which Wikipedia's bot policy accepts.
      - WEB_LOADER_USER_AGENT=vibe-chat/0.1 (+https://github.com/gallowaysoftware/vibe; contact via repo)
    volumes:
      - ${VIBE_FRONTEND_STATE}/data:/app/backend/data
      # See sitecustomize.py for why this exists. Mounted at Python's
      # site-packages root so it auto-runs at every Python startup
      # inside the container.
      - ${SITECUSTOMIZE_PY}:/usr/local/lib/python3.11/site-packages/sitecustomize.py:ro
    restart: unless-stopped
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: vibe-chat-searxng
    network_mode: host
    volumes:
      - ${SEARXNG_CONFIG}:/etc/searxng
    environment:
      # Modern SearXNG images alias SEARXNG_PORT → granian --port at
      # startup; settings.yml server.port is ignored. Picked 14001
      # rather than the SearXNG default 8888 — that collides with
      # Jupyter notebook for ML users.
      - SEARXNG_PORT=14001
      - SEARXNG_BASE_URL=http://127.0.0.1:14001/
    restart: unless-stopped
