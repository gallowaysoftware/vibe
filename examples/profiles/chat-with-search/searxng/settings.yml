# Minimal SearXNG config — everything else inherits from the upstream
# default settings.yml inside the image. Two non-default things matter:
#
#   1. JSON output is required for Open WebUI's web-search retriever
#      to parse results (SearXNG ships with HTML-only by default).
#   2. secret_key MUST be replaced with a real random value before
#      starting the container — generate one with `openssl rand -hex 32`.

use_default_settings: true

server:
  # REPLACE: random 64-hex-char string. `openssl rand -hex 32`.
  secret_key: "REPLACE-WITH-RAND-HEX-32"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

ui:
  static_use_hash: true

general:
  debug: false
  instance_name: "vibe-searxng"
