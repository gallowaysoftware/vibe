# Example: chat profile with Open WebUI + SearXNG + Tier-1 RAG (BGE-M3).
#
# Copy this file to $XDG_CONFIG_HOME/vibe/profiles/chat.yaml and adapt
# the marked sections. Companion docker-compose.yaml lives next door;
# copy it to $XDG_CONFIG_HOME/vibe/compose/chat/ and the searxng/
# subdir alongside (then generate a real secret_key — see README).
#
# Frontend.env values are expanded at activation time by vibe and
# passed through to the compose subprocess, so the compose file can
# reference $VIBE_FRONTEND_STATE and $SEARXNG_CONFIG without hard-
# coding home paths. Adapt $VIBE_FRONTEND_STATE if you rename the
# profile (it must match the profile.name above so vibe's mkdir-on-
# activate creates the right directory).

name: chat
description: General-purpose chat — local Gemma 3 (vision) + Open WebUI + SearXNG.

backend:
  llama_server:
    # Gemma 3 27B-it at Q6_K — biggest Gemma 3, near-Q8 quality, fits
    # on a 32 GB card alongside a 32K KV cache. Drop to Q4_K_M (~17 GB
    # weights) for a 24 GB card, or to gemma-3-12b-it-GGUF for 16 GB.
    # The accompanying mmproj GGUF is what enables image input.
    path: ~/models/gemma-3-27b-it-GGUF/gemma-3-27b-it-Q6_K.gguf
    mmproj: ~/models/gemma-3-27b-it-GGUF/mmproj-model-f16.gguf
    huggingface:
      repo: ggml-org/gemma-3-27b-it-GGUF
      file: gemma-3-27b-it-Q6_K.gguf
      # Same repo, second file — pulled into the mmproj path above.
      mmproj_file: mmproj-model-f16.gguf
    # Must match the alias llama-server advertises at /v1/models —
    # Open WebUI uses it as the model picker label.
    alias: gemma-3-27b-it
    # Gemma 3 supports 128k; 32k is a sane VRAM/quality default. Bump
    # if you need long-context retrieval and have headroom.
    context: 32768
    parallel: 1
    gpu_layers: 999
    flash_attn: true
    cache_type_k: q8_0
    cache_type_v: q8_0
    jinja: true

frontend:
  kind: docker-compose
  app: open-webui
  # REPLACE: absolute path to where you dropped the docker-compose.yaml.
  compose_file: ~/.config/vibe/compose/chat/docker-compose.yaml
  project_name: vibe-chat
  env:
    # Passed through to docker compose's process env so the compose
    # file can reference ${VIBE_FRONTEND_STATE}. ${VIBE_STATE_DIR} is
    # expanded by vibe itself (resolves to $XDG_STATE_HOME/vibe).
    VIBE_FRONTEND_STATE: ${VIBE_STATE_DIR}/frontend/chat
    # REPLACE: absolute path to the searxng/ config dir bundled with
    # this example. Must contain a settings.yml with a real secret_key.
    SEARXNG_CONFIG: ~/.config/vibe/compose/chat/searxng
  wait_for:
    - url: http://127.0.0.1:14001/healthz
      timeout: 120s
    - url: http://127.0.0.1:8080/
      timeout: 120s

# Approximate VRAM: Gemma 3 27B-it Q6_K weights (~22 GB) + mmproj
# (~1 GB) + KV cache at 32k ctx q8_0 (~3 GB) + overhead ≈ 26 GB.
# Adjust if you raise the context window, swap quants, or swap model.
estimated_vram_gb: 28
