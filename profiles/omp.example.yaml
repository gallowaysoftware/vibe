# Example profile: oh-my-pi pointed at the whole fleet in one render.
#
# Copy to $XDG_CONFIG_HOME/vibe/profiles/omp.yaml, adjust, then `vibe start omp`.
#
# The point of this profile is that a coding harness needs exactly three
# things pointed at infrastructure — models, search, and page fetch — and
# wiring them by hand on every machine is the actual friction. Here the
# router supplies models and `search_url` supplies the other two, so the
# rendered config is complete.
#
# Requires in ~/.config/vibe/config.yaml:
#   search_url: http://<vibe-search-host>:14003    # backs ${VIBE_SEARCH}
# A profile referencing ${VIBE_SEARCH} without that set refuses to activate
# and says so, rather than rendering an empty endpoint into the config.

name: omp
description: oh-my-pi against the fleet router, with central search + fetch

# The model lives on the fleet router, so there is nothing local to launch:
# external means vibe verifies the router serves this id and then gets out
# of the way. Swap to a llama_server/mlx_server backend_ref for the
# disconnected case — everything below is unchanged, because ${MODEL_ALIAS}
# and ${VIBE_API} come from whichever backend is active.
backend:
  external: true
  llama_server:
    # REPLACE: the GGUF path is only consulted when vibe runs the model
    # itself. With external: true it is metadata.
    path: ~/models/REPLACE-ME.gguf
    alias: kimi-k3
    context: 1048576

frontend:
  kind: external
  app: omp
  # omp reads its config once at startup.
  restart_required: true

  env:
    # Isolated auth, sessions, settings, and caches for this profile. Use
    # omp's own mechanism rather than inventing a parallel state dir; pair
    # with `omp --profile omp --alias omp-fleet` for a shell shortcut.
    OMP_PROFILE: omp
    # PI_CONFIG_DIR is joined onto $HOME unconditionally — an absolute path
    # comes back mangled and a literal ~ is not expanded. Keep it
    # home-relative and keep it in sync with write_files below by hand.
    # (PI_CODING_AGENT_DIR would override this entirely; don't set both.)
    PI_CONFIG_DIR: .omp-vibe/omp

  # Two files because omp splits providers from settings. The first entry
  # backs ${WRITE_FILE}.
  write_files:
    - path: ~/.omp-vibe/omp/agent/models.yml
      template:
        providers:
          fleet:
            baseUrl: ${VIBE_API}
            api: openai-completions
            # llama-swap does not check this, but omp requires a value.
            apiKey: fleet
            authHeader: true
            models:
              - id: ${MODEL_ALIAS}
                name: ${MODEL_ALIAS}
                reasoning: true
                input: [text]
                contextWindow: ${MODEL_CONTEXT}
                maxTokens: 131072
                # REPLACE per model. These flags are what make tool calls
                # work on Kimi-family models through an OpenAI-compatible
                # endpoint; a wrong set here fails at the first tool call,
                # not at startup.
                compat:
                  thinkingFormat: openai
                  supportsReasoningEffort: true
                  requiresReasoningContentForToolCalls: true
                  requiresAssistantContentForToolCalls: true
                  alwaysSendMaxTokens: true
                  disableReasoningOnForcedToolChoice: true

    - path: ~/.omp-vibe/omp/agent/config.yml
      template:
        modelRoles:
          default: fleet/${MODEL_ALIAS}
        providers:
          # Pin the search provider: the default "auto" chain would
          # otherwise fall through to a free scraper and quietly stop using
          # the paid plane.
          webSearchOrder:
            - searxng
        searxng:
          # Not actually SearXNG — vibe-search speaks that wire contract
          # because it is the one search endpoint harnesses let you
          # redirect. Behind it is whatever provider the plane is
          # configured with.
          endpoint: ${VIBE_SEARCH}
          # The bearer token is deliberately absent: vibe renders config,
          # never secrets. Set it once per machine with
          #   omp config set searxng.token <token>
          # or export SEARXNG_TOKEN.

# NOTE — page fetch is not configured here. omp resolves MCP servers from
# ~/.claude.json (shared with Claude Code) or a project-level .mcp.json, not
# from its own config dir, so the fetch_url tool is registered once per
# machine rather than per profile:
#
#   "vibe-search": {
#     "type": "http",
#     "url": "http://<vibe-search-host>:14003/mcp",
#     "headers": {"Authorization": "Bearer <token>"}
#   }
#
# Search goes through omp's NATIVE path above (not MCP), which is why the
# two halves are configured in different places.

# No local model, no VRAM: the router owns the weights.
estimated_vram_gb: 0
