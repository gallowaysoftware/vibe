# Example profile: coding task with Qwen3 Coder + opencode.
#
# Copy this file to $XDG_CONFIG_HOME/vibe/profiles/code.yaml (typically
# ~/.config/vibe/profiles/code.yaml), edit paths/aliases to match your
# environment, then `vibe start code`.

name: code
description: Coding with Qwen3 Coder 30B + opencode

model:
  path: ~/models/qwen3-coder-30b-q6_k.gguf
  # Must match the model id that llama-server advertises at /v1/models;
  # opencode uses this string to route requests.
  alias: qwen3-coder-30b
  context: 190000
  parallel: 1
  gpu_layers: 999
  flash_attn: true
  cache_type_k: q8_0
  cache_type_v: q8_0
  jinja: true
  extra_args:
    - --no-mmap

frontend:
  kind: external
  app: opencode
  # opencode reads its config once at startup and does not hot-reload, so
  # switching profiles while opencode is running requires restarting opencode.
  restart_required: true
  write_file: ~/.config/opencode/opencode.json
  template:
    $schema: https://opencode.ai/config.json
    provider:
      vibe-local:
        npm: "@ai-sdk/openai-compatible"
        name: vibe (llama-server)
        options:
          baseURL: ${VIBE_API}
        models:
          ${MODEL_ALIAS}:
            name: ${MODEL_ALIAS}
            limit:
              context: ${MODEL_CONTEXT}
              output: 8192
    model: vibe-local/${MODEL_ALIAS}

estimated_vram_gb: 26
