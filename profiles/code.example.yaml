# Example profile: coding task with Qwen3 Coder + opencode.
#
# Copy this file to $XDG_CONFIG_HOME/vibe/profiles/code.yaml (typically
# ~/.config/vibe/profiles/code.yaml), edit paths/aliases to match your
# environment, then `vibe start code`.
#
# vibe writes a sidecar opencode config to a vibe-managed path instead of
# overwriting ~/.config/opencode/opencode.json. After `vibe start`, the CLI
# prints the OPENCODE_CONFIG env var you need to set when launching opencode.

name: code
description: Coding with Qwen3 Coder 30B + opencode

backend:
  # `llama_server` is one of two supported backend kinds (the other is
  # `comfyui`). Exactly one block under `backend:` must be set.
  llama_server:
    path: ~/models/qwen3-coder-30b-q6_k.gguf
    # Must match the model id that llama-server advertises at /v1/models;
    # opencode uses this string to route requests.
    alias: qwen3-coder-30b
    context: 190000
    parallel: 1
    gpu_layers: 999
    flash_attn: true
    cache_type_k: q8_0
    cache_type_v: q8_0
    jinja: true
    # opencode sends an OpenAI `tools` array, and `jinja: true` alone only
    # promises "render whatever template this GGUF happens to carry" — early
    # Qwen3-Coder quants shipped a template that broke tool calls and were
    # re-uploaded fixed in place, so a GGUF pulled before that keeps the broken
    # one. Uncomment to pin a known-good template if tool calls misbehave.
    # What the running backend actually resolved:
    #   curl -s ${VIBE_API%/v1}/props | jq .chat_template_caps
    # chat_template_file: ~/models/templates/qwen3-coder-tools.jinja
    extra_args:
      - --no-mmap

frontend:
  kind: external
  app: opencode
  # opencode reads its config once at startup and does not hot-reload, so
  # relaunching opencode is required to pick up the new endpoint.
  restart_required: true
  write_file: ${VIBE_STATE_DIR}/frontend/code/opencode.json
  # MCP servers to wire into this profile. Each name resolves to
  # $XDG_CONFIG_HOME/vibe/mcp/<name>.yaml (see profiles/mcp.example.yaml for
  # the format). Vibe injects a top-level `mcp` map into the rendered config.
  # Uncomment after dropping in matching definitions:
  # mcps: [datadog]
  env:
    # Vibe surfaces this back to the user via `vibe start` output; you should
    # set it (or eval `vibe env code`) before launching opencode.
    OPENCODE_CONFIG: ${WRITE_FILE}
  template:
    $schema: https://opencode.ai/config.json
    provider:
      vibe-local:
        npm: "@ai-sdk/openai-compatible"
        name: vibe (llama-server)
        options:
          baseURL: ${VIBE_API}
        models:
          ${MODEL_ALIAS}:
            name: ${MODEL_ALIAS}
            limit:
              context: ${MODEL_CONTEXT}
              output: 8192
    model: vibe-local/${MODEL_ALIAS}

estimated_vram_gb: 26
