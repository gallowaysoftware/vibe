# seedbox: qBittorrent for bulk dump torrents (subkb backfills) + altruism
# seeding of the Reddit archive torrents (Kyle-authorized 1TB budget).
#
# STORAGE (the two-mount house pattern — learned the hard way 2026-07-31):
#   /downloads -> appdata (SSD cache pool): ONLY small ingest files. The
#     cache pool is ~954GB shared with postgres/riff/immich — four
#     preallocating monthlies filled it at 2AM and crashed subkb-postgres.
#   /archive   -> /mnt/disk6/archives (array): all torrent payloads.
#     Pinned to a disk mount deliberately: /mnt/user share-cfg changes
#     don't apply to a running shfs, so /mnt/diskN is the reliable way
#     to guarantee array placement.
# Downloads land in the subkb dumps share, which subkb-app mounts read-only
# at /data — so a finished file is immediately kbctl-backfillable.
# WebUI :8085 on the LAN (house posture); localhost auth is disabled for
# scripted control from the unraid shell, LAN access needs the password
# qBittorrent prints to the container log on first start.
services:
  seedbox:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: seedbox
    restart: unless-stopped
    environment:
      PUID: "99"
      PGID: "100"
      TZ: America/Halifax
      WEBUI_PORT: "8085"
      TORRENTING_PORT: "6881"
    ports:
      - "8085:8085"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /mnt/user/appdata/seedbox/config:/config
      - /mnt/user/appdata/subkb/dumps:/downloads
      - /mnt/disk6/archives:/archive
