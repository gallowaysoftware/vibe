# EXAMPLE VALUES. `gpu-cell`, `front-host` and the paths below describe a
# reference fleet; replace them with your own. The shape is what matters.
#
# A drop-in for the unit that IS this cell's serving stack — whatever
# `cell_cmds.drain` stops. On the reference fleet that is llama-swap;
# install this as, e.g.:
#
#   /etc/systemd/system/llama-swap.service.d/50-vibe-intent.conf
#
# It teaches the unit to record its own lifecycle on the fleet's intent
# axis (fleet-control C24). Nothing here starts, stops or restarts
# anything: both hooks run a script whose only side effect is one bounded
# HTTP POST to fleetd.

[Service]
Environment=VIBE_FLEETD_URL=http://front-host:9001
Environment=VIBE_CELL=gpu-cell
Environment=VIBE_TOKEN_FILE=/etc/vibe/fleetd-token
Environment=VIBE_INTENT_TIMEOUT=3

# The `-` prefix makes systemd ignore the command's exit status. The
# script already exits 0 on every path, and this is the belt to that
# braces: a non-zero ExecStopPost puts the unit into `failed`, where
# `OnFailure=` units fire — which would turn a recorder into a trigger
# through a path nothing in the script can see.
ExecStartPost=-/usr/local/lib/vibe/vibe-cell-intent.sh started
ExecStopPost=-/usr/local/lib/vibe/vibe-cell-intent.sh stopped

# Must exceed llama-swap's own SIGTERM-time stream grace (measured at a
# hardcoded 30s on v239 and v247 — C16) PLUS the hook's bound above,
# or systemd SIGKILLs the stop sequence and the hook never runs. 45 is
# 30 + 3 + slack; raise it, do not lower it.
TimeoutStopSec=45
