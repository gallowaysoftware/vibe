# llama-swap FRONT config (peers only — the front owns no models and no GPU).
# Lives at /mnt/user/appdata/llama-swap-front/config.yaml on unraid.
#
# HAND-MAINTAINED FOR NOW. Note the per-peer `models:` lists are explicit,
# so adding a backend def on a cell means adding its id here too — that
# duplication is exactly why `vibe router render --cell front` (topology.md
# §3 item 1) is the first build item; once it lands, vibe renders + pushes
# this file and hand-editing stops.
#
# Cells must listen on their LAN address (not 127.0.0.1) once the front
# moves here — flip localmodel's unit to `-listen 0.0.0.0:9000` (LAN is
# VPN-gated; add peer apiKey later if that ever changes).

sendLoadingState: true   # relays cells' loading bytes to clients (proven unbuffered)

peers:
  # GPU cells — each is that box's own llama-swap, which owns JIT/TTL/swap.
  localmodel:
    proxy: http://localmodel:9000
    models:
      - qwen3.6-27b
      - qwen3.6-27b-mtp-q6_k
      - qwen3.6-27b-tools
      - gemma-4-31b
      - gemma-4-31b-it
      - gemma-4-31b-mm
      - gemma-4-31b-tools
      - qwen2.5-coder-7b
      - comfyui
  # llamaloft:                       # uncomment when the 3080 Ti box is up
  #   proxy: http://llamaloft:9000
  #   models: [bge-embed, rerank, classifier, kokoro-tts, whisper]
  # spark:                           # uncomment when the pair is commissioned
  #   proxy: http://spark-1:9000
  #   models: [dsv4flash, qwen3-coder-next]

  # Cloud — explicit model ids, never a fallback target.
  anthropic:
    proxy: https://api.anthropic.com
    apiKey: ${env.ANTHROPIC_API_KEY}
    models:
      - claude-opus-4-8
      - claude-sonnet-5
