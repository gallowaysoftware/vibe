# hum front config: llama-swap, peers only — the front owns no models and
# no GPU. Lives at <appdata>/hum/front/config.yaml on the hum host (the
# docker-compose.yaml bind mount).
#
# HAND-MAINTAINED FOR NOW. Note the per-peer `models:` lists are explicit,
# so adding a backend def on a cell means adding its id here too — that
# duplication is exactly why `vibe router render --cell front` (topology.md
# §3 item 1) is the first build item; once it lands, vibe renders + pushes
# this file and hand-editing stops.
#
# Cells must listen on their LAN address (not 127.0.0.1) once the front
# moves here — flip localmodel's unit to `-listen 0.0.0.0:9000` (LAN is
# VPN-gated; add peer apiKey later if that ever changes).

sendLoadingState: true   # relays cells' loading bytes to clients (proven unbuffered)

peers:
  # GPU cells — each is that box's own llama-swap, which owns JIT/TTL/swap.
  localmodel:
    proxy: http://localmodel:9000
    models:
      - qwen3.6-27b
      - qwen3.6-27b-mtp-q6_k
      - qwen3.6-27b-tools
      - gemma-4-31b
      - gemma-4-31b-it
      - gemma-4-31b-mm
      - gemma-4-31b-tools
      - qwen2.5-coder-7b
      - comfyui
  # llamaloft:                       # uncomment when the 3080 Ti box is up
  #   proxy: http://llamaloft:9000
  #   models: [bge-embed, rerank, classifier, kokoro-tts, whisper]
  # spark:                           # uncomment when the pair is commissioned
  #   proxy: http://spark-1:9000
  #   models: [dsv4flash, qwen3-coder-next]

  # Cloud — explicit model ids, never a fallback target. Disabled until a
  # key is wanted: uncomment AND set ANTHROPIC_API_KEY in the stack .env
  # (leaving this enabled with an empty key would list claude ids in the
  # catalog that fail on use).
  # anthropic:
  #   proxy: https://api.anthropic.com
  #   apiKey: ${env.ANTHROPIC_API_KEY}
  #   models:
  #     - claude-opus-4-8
  #     - claude-sonnet-5

  # Moonshot AI (Kimi) — OpenAI-compatible, so llama-swap's plain proxy
  # forwards the request as-is; Moonshot applies its own chat template
  # server-side (no --jinja / local template concern, unlike the GPU
  # cells' llama_server backends). Uncomment AND set MOONSHOT_API_KEY in
  # the stack .env first (same empty-key caveat as anthropic above).
  # proxy is the bare origin (no /v1) — same shape as the anthropic peer
  # above: llama-swap forwards the incoming .../v1/chat/completions path
  # as-is, so a proxy value ending in /v1 double-appends it and Moonshot
  # 404s the request.
  # kimi:
  #   proxy: https://api.moonshot.ai
  #   apiKey: ${env.MOONSHOT_API_KEY}
  #   models:
  #     - kimi-k3
