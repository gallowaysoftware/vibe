# hum: the fleet's always-on front router (docs/design/topology.md §1).
# INFRA — this is the stable :9000 every client in the fleet points at,
# forever. Applications that consume it (e.g. deploy/riff) are separate
# stacks with their own lifecycles; nothing else belongs in this one.
#
# Plain docker compose — runs anywhere; on unraid use the Docker Compose
# Manager plugin. Needs an .env with ANTHROPIC_API_KEY.
#
# Volume path is an example (unraid appdata style) — adjust to the host.

services:
  hum-front:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: hum-front
    restart: unless-stopped
    ports:
      - "9000:8080"            # LAN-facing stable address; container listens on 8080
    volumes:
      - /mnt/user/appdata/hum/front/config.yaml:/app/config.yaml:ro
    environment:
      # Consumed by ${env.ANTHROPIC_API_KEY} in config.yaml (peers.anthropic).
      # Set the real key in the compose-manager env / an .env file, not here.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set in .env}
