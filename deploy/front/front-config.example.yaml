# Front config: llama-swap, peers only — the front owns no models and no
# GPU. Lives at the path the docker-compose.yaml bind-mounts.
#
# EXAMPLE VALUES. Peer names, hostnames and model ids below describe a
# reference fleet; replace them with your own cells. The shape is what
# matters: one peer per cell, each listing the model ids that cell serves.
#
# HAND-MAINTAINED FOR NOW. Note the per-peer `models:` lists are explicit,
# so adding a backend def on a cell means adding its id here too — that
# duplication is exactly why `vibe router render --cell front` (topology.md
# §3 item 1) is the first build item; once it lands, vibe renders + pushes
# this file and hand-editing stops.
#
# Cells must listen on their LAN address, not 127.0.0.1, once a front
# fronts them (`-listen 0.0.0.0:9000`). If the LAN is not otherwise
# gated, give each peer an apiKey.

sendLoadingState: true   # relays cells' loading bytes to clients (proven unbuffered)

peers:
  # GPU cells — each is that box's own llama-swap, which owns JIT/TTL/swap.
  gpu-cell:                          # a workstation-class GPU box
    proxy: http://gpu-cell-host:9000
    models:
      - <chat-model>
      - <chat-model>-tools           # the tool-calling def, if separate
      - <vision-model>
      - <coder-model>
      - comfyui
  # utility-cell:                    # small always-warm service models
  #   proxy: http://utility-cell-host:9000
  #   models: [bge-embed, rerank, classifier, kokoro-tts, whisper]
  # heavy-cell:                      # large-model host
  #   proxy: http://heavy-cell-host:9000
  #   models: [<big-model>]

  # Cloud — explicit model ids, never a fallback target. Disabled until a
  # key is wanted: uncomment AND set ANTHROPIC_API_KEY in the stack .env
  # (leaving this enabled with an empty key would list claude ids in the
  # catalog that fail on use).
  # anthropic:
  #   proxy: https://api.anthropic.com
  #   apiKey: ${env.ANTHROPIC_API_KEY}
  #   models:
  #     - claude-opus-4-8
  #     - claude-sonnet-5
