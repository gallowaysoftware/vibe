# The fleet front: an always-on llama-swap router (docs/design/topology.md
# §1). INFRA — this is the stable :9000 every client in the fleet points
# at, forever. Applications that consume it are separate stacks with their
# own lifecycles; nothing else belongs in this one.
#
# REFERENCE STACK. It runs as-is on a macvlan-capable Docker host once
# .env is filled; adapt the networking to your own setup.
#
# Networking (the pattern this example uses):
#   - `macvlan` (an external network, `br0` here): the front gets its own
#     LAN IP so it appears as a real host — THE fleet address. GPU cells,
#     chat stacks, coding harnesses and phones all dial
#     http://<FRONT_IPV4>:9000. No port mapping — macvlan has no NAT; the
#     container's listen port is reachable directly on its IP.
#   - macvlan/host isolation caveat: the Docker host itself cannot reach
#     this IP (and vice versa) without a macvlan shim. Sanity-check from
#     another LAN box, not the host's own shell.
#
# Prereqs: the external macvlan network exists; the front config file is
# in place under FRONT_CONFIG_DIR. .env (sibling of this file): FRONT_IPV4,
# FRONT_CONFIG_DIR, and ANTHROPIC_API_KEY if a cloud peer is enabled.

services:

  front:
    # DIGEST-PINNED BY DEFAULT (fleet-control C16). The tag half names the
    # build for a human; the @sha256 half is what docker resolves, so
    # `docker compose pull` cannot change which llama-swap this fleet runs.
    #
    # On 2026-08-05 the floating `:cpu` tag was found to be serving v247
    # while the fleet was gated on v239. v240+ changed the /api/events
    # in-flight wire, vibe read the new shape as ZERO in flight, and eight
    # busy guards — drain --wait, suspend, the probe guard, both warm loops
    # — disarm on a reported zero. A routine pull on this host was the whole
    # trigger. Moving the pin is the ritual in scripts/upgrade/, not an edit.
    image: ${FRONT_IMAGE:-ghcr.io/mostlygeek/llama-swap:v239-cpu-b9994@sha256:6bae869ec0908538e421172fd576288e87c1bc330acde24517992507218d2c7c}
    container_name: ${FRONT_NAME:-fleet-front}
    restart: unless-stopped
    # The image defaults to listening on 8080; pin the canonical fleet port.
    # -watch-config hot-reloads the config, so membership edits stop being
    # catalog outages.
    command: ["-config", "/app/config/config.yaml", "-listen", ":9000", "-watch-config"]
    # The image's own healthcheck curls :8080 — the default the command above
    # deliberately overrides — so without this the front reports unhealthy
    # from the moment it starts and never recovers, which means a real outage
    # looks exactly like steady state.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # The peers config's parent DIRECTORY (see front-config.example.yaml),
      # not the file: a single-file bind mount pins the inode, so
      # atomic-rename (tmp+rename) writes — how renderers write — never
      # reach the running container. The config is /app/config/config.yaml.
      - ${FRONT_CONFIG_DIR:?set FRONT_CONFIG_DIR to the front config directory}:/app/config:ro
    environment:
      # Consumed by ${env.ANTHROPIC_API_KEY} in config.yaml if the
      # anthropic peer is enabled there; empty is fine until then.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      macvlan:
        ipv4_address: ${FRONT_IPV4:?set FRONT_IPV4 to the front's LAN address}
    labels:
      # Unraid convenience labels; harmless elsewhere.
      net.unraid.docker.webui: "http://${FRONT_IPV4}:9000/ui"
      net.unraid.docker.shell: "sh"
    # This container runs forever on the box that also stores the model
    # library; the json-file default is unbounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  macvlan:
    external: true
    name: ${MACVLAN_NETWORK:-br0}
