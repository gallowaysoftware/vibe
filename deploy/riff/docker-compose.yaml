# riff: the persistent chat/research app (topology.md UC1) — Open WebUI +
# SearXNG. APPLICATION — a client of the hum front (deploy/hum) like any
# other; it consumes hum's LAN address, not a private link, so the two
# stacks deploy/restart/upgrade independently.
#
# Networking (house pattern, same as the stillhouse stack):
#   - `riff` bridge: internal; webui ↔ searxng talk over it. SearXNG has
#     no LAN exposure at all.
#   - `macvlan` (br0 external): the webui gets its own LAN IP (default
#     172.16.3.212) so it appears as a real host. NPM proxies
#     chat.<domain> → <RIFF_IPV4>:8080 for TLS + Authelia forward-auth.
#     No port mapping — macvlan has no NAT.
#   - macvlan/host isolation: the webui CANNOT reach ports published on
#     the unraid host IP — which is why hum-front has its own macvlan IP
#     (HUM_URL below), and why sanity checks run from another LAN box.
#
# Prereqs: br0 is an existing macvlan network on unraid (Settings → Docker).
# .env (sibling of this file): HUM_URL (e.g. http://172.16.3.211:9000),
# WEBUI_SECRET_KEY (openssl rand -hex 32), optionally RIFF_IPV4.

services:

  riff-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: riff-webui
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/riff/webui:/app/backend/data
    environment:
      # Model access: the hum front's LAN address.
      OPENAI_API_BASE_URL: ${HUM_URL:?HUM_URL must be set in .env}/v1
      OPENAI_API_KEY: vibe-local
      # SSO: Authelia forward-auth injects Remote-Email; OWUI trusts it.
      # NPM MUST strip inbound Remote-* headers or anyone can forge a
      # login (README.md has the exact nginx block).
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: Remote-Email
      WEBUI_AUTH_TRUSTED_NAME_HEADER: Remote-Name
      WEBUI_URL: ${RIFF_PUBLIC_URL:-https://chat.example.com}
      # Pin the session secret so logins survive container recreation
      # (owui-chat-profile gotcha). Generate once: openssl rand -hex 32
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set in .env}
      # Env is the source of truth, not the DB (PersistentConfig masks
      # compose env otherwise — the classic OWUI gotcha).
      ENABLE_PERSISTENT_CONFIG: "False"
      # Web search via searxng; bypass the web-loader (playwright loader
      # yields "no sources" — known bug, same fix as the chat profile).
      ENABLE_WEB_SEARCH: "True"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://riff-search:8080/search?q=<query>
      BYPASS_WEB_SEARCH_WEB_LOADER: "True"
      WEB_SEARCH_RESULT_COUNT: "5"
      # External tool server: subkb (subreddit-knowledge-aggregator) as a
      # native MCP streamable-HTTP connection — search_knowledge,
      # get_thread, get_document, list_collections. Declared HERE and not
      # in the admin UI because persistent config is off: UI-added tool
      # servers revert to this env value on the next recreate. Both
      # containers sit on br0, so the macvlan/host gotcha doesn't apply.
      # Per-expert workspace models attach these tools and pin their
      # collection in the system prompt (README "Knowledge experts").
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"mcp",
          "url":"${SUBKB_URL:-http://172.16.3.214:8091}/mcp",
          "auth_type":"none",
          "info":{"id":"subkb","name":"Subreddit Knowledge",
                  "description":"Hybrid RAG over archived subreddit corpora and curated documents"},
          "config":{"enable":true,"access_control":null}}]
    depends_on: [riff-search]
    networks:
      macvlan:
        ipv4_address: ${RIFF_IPV4:-172.16.3.212}
      riff: {}
    labels:
      net.unraid.docker.webui: "http://${RIFF_IPV4:-172.16.3.212}:8080"
      net.unraid.docker.shell: "sh"

  riff-search:
    image: searxng/searxng:latest
    container_name: riff-search
    restart: unless-stopped
    # No macvlan, no published ports — only the webui talks to it.
    networks: [riff]
    volumes:
      - /mnt/user/appdata/riff/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://riff-search:8080/

networks:
  riff:
    driver: bridge
    name: riff
  macvlan:
    external: true
    name: br0
