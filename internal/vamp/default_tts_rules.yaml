# Default TTS pronunciation rules — applied to every script before
# the audio stage submits text to Kokoro / Chatterbox. Rules execute
# top-to-bottom; later regexes match against text that earlier rules
# may have rewritten.
#
# Two rule kinds:
#   pattern    — literal substring match (case-sensitive)
#   regex      — Go-flavor regex; $1 $2 ... reference capture groups
#
# Adding a rule:
#   1. Read the script line that mispronounces.
#   2. Determine the minimum invariant — what's the surface form
#      Kokoro mis-reads? Anchor your regex on that, not on
#      neighboring words.
#   3. Test mentally: would your rule fire on intended cases (good)
#      AND on something it shouldn't (bad)? If the latter, narrow.
#
# Per-pipeline overrides go in each pipeline's tts_rules.yaml and
# layer on top of these defaults.

rules:
  # ---- Hyphenated alphanumerics (Kokoro reads "-" as "minus") ----

  - regex: '\b([A-Za-z])-([0-9]+)\b'
    replacement: '$1 $2'
    note: |
      "F-150" -> "F 150" (heard "eff minus one fifty"). Catches model
      numbers, vehicle designations, single-letter labels. Doesn't
      touch "Chapter 10 - Intro" because the hyphen has spaces.

  - regex: '\b([A-Za-z]{2,})-([0-9]+)\b'
    replacement: '$1 $2'
    note: |
      Multi-letter prefix variant: "B-12", "S-class", "PMID-12345".
      Same fix as the single-letter rule.

  # ---- Fractions / ratios that Kokoro reads letter-by-letter ----

  - regex: '\bd([a-zA-Z])/d([a-zA-Z0-9])\b'
    replacement: 'd $1 over d $2'
    note: |
      "di/d0" -> "d i over d 0" (heard "dye over doe"). Catches
      differential / ratio notation common in chemistry + physics
      textbooks. Lowercase 'd' anchored.

  - regex: '(^|[^0-9/])([0-9]+)/([0-9]+)($|[^0-9/])'
    replacement: '${1}${2} over ${3}${4}'
    note: |
      "1/2", "3/4" -> "1 over 2", "3 over 4", and now actually skips
      dates. The old form was '\b([0-9]+)/([0-9]+)\b', whose note
      already claimed dates were "caught elsewhere" — they were not,
      and nothing was elsewhere: 8/9/2026 came out "8 over 9/2026",
      heard as "eight over nine slash two thousand twenty six". RE2
      has no lookaround, so the guards are ordinary capture groups
      that consume one character on each side and re-emit it. That is
      also why this rule appears TWICE: consuming the right-hand
      character means a second fraction separated by a SINGLE
      character ("1/2 3/4") starts inside the first match's tail and
      is missed. The second pass sees the rewritten text and catches
      it. ${N} braces are required — $1grams would parse as a group
      NAMED "1grams".

  - regex: '(^|[^0-9/])([0-9]+)/([0-9]+)($|[^0-9/])'
    replacement: '${1}${2} over ${3}${4}'
    note: 'Second pass; see above.'

  # ---- Units / abbreviations the TTS doesn't speak naturally ----
  #
  # Every unit rule is a REGEX with a left boundary, not a literal
  # `pattern:`. A literal is strings.ReplaceAll, which fires mid-token:
  # `pattern: 'm/s'` turned "km/s" into "kmetres per second" and
  # `pattern: 'g/L'` turned "µg/L" into "µgrams per litre" — worse
  # than the untouched input, in a chemistry textbook, silently.
  # `mg/L` escaped only because it happened to be ordered first.
  #
  # The left guard is `(^|[^A-Za-z])` re-emitted as ${1} rather than
  # `\b`, because Go's `\b` is ASCII-only: there is no word boundary
  # in front of `µ`, so `\bµg/L` could never match at all.

  - regex: '(^|[^A-Za-z])km/s\b'
    replacement: '${1}kilometres per second'

  - regex: '(^|[^A-Za-z])cm/s\b'
    replacement: '${1}centimetres per second'

  - regex: '(^|[^A-Za-z])mm/s\b'
    replacement: '${1}millimetres per second'

  - regex: '(^|[^A-Za-z])m/s\b'
    replacement: '${1}metres per second'

  - regex: '(^|[^A-Za-zµμ])mg/L\b'
    replacement: '${1}milligrams per litre'
    note: 'Concentration units.'

  - regex: '(µ|μ)g/L\b'
    replacement: 'micrograms per litre'
    note: |
      Both the MICRO SIGN (U+00B5) and GREEK SMALL LETTER MU (U+03BC)
      — text extraction emits either. The prefix is consumed, not
      re-emitted: it IS the "micro".

  - regex: '(^|[^A-Za-z])ng/L\b'
    replacement: '${1}nanograms per litre'

  - regex: '(^|[^A-Za-zµμ])g/L\b'
    replacement: '${1}grams per litre'

  - regex: '(^|[^A-Za-z])L/kg\b'
    replacement: '${1}litres per kilogram'

  - regex: '(^|[^A-Za-z])kg/m³'
    replacement: '${1}kilograms per cubic metre'
    note: |
      No trailing \b: `³` is not an ASCII word character, so a word
      boundary after it can never match.

  - regex: '\b([0-9.]+)°([CFK])\b'
    replacement: '$1 degrees $2'
    note: |
      "70°C" -> "70 degrees C". Numeric prefix anchors so the rule
      doesn't fire on a bare "°C" (which Kokoro generally handles).

  - regex: '\b([0-9.]+)%'
    replacement: '$1 percent'
    note: |
      "12.5%" -> "12.5 percent". `%` is not a word character so a
      trailing \b doesn't work (would require a word char after);
      we accept the no-anchor form here.

  # ---- Acronyms Kokoro mangles ----
  #
  # Deliberately empty, and this comment is the reason it is not a
  # bare header. A section with nothing under it reads as "somebody
  # meant to fill this in", and the fraction rule above used to point
  # at it — "caught elsewhere" — as if it had.
  #
  # There is no shared acronym list because there is no shared domain.
  # LAA, ABV, PMID and the rest are per-pipeline, and a spell-out that
  # is right for a distillery script is wrong for a chemistry one.
  # Domain acronyms belong in the owning pipeline's tts_rules.yaml,
  # which layers on top of this file; the test
  # TestTTSNormalize_UnitsExpandedAcronymsUntouched pins that.

