# Starter profile: llama-server backend + external frontend (opencode).
#
# This file was dropped by `vibe profile init llama-server`. Edit the
# REPLACE-marked lines below, then `vibe start __PROFILE_NAME__`.
#
# vibe writes a sidecar opencode config to a vibe-managed path instead of
# overwriting ~/.config/opencode/opencode.json. After `vibe start`, the CLI
# prints the OPENCODE_CONFIG env var you need to set when launching opencode.

name: __PROFILE_NAME__
description: __PROFILE_NAME__ (llama-server + opencode)

backend:
  llama_server:
    # REPLACE: absolute or ~/-prefixed path to your GGUF model file.
    path: ~/models/REPLACE-model.gguf
    # REPLACE: must match the model id llama-server advertises at /v1/models.
    alias: REPLACE-model-alias
    context: 32768
    parallel: 1
    gpu_layers: 999
    flash_attn: true
    cache_type_k: q8_0
    cache_type_v: q8_0
    jinja: true
    # extra_args:
    #   - --no-mmap

frontend:
  kind: external
  app: opencode
  # opencode reads its config once at startup and does not hot-reload, so
  # relaunching opencode is required to pick up the new endpoint.
  restart_required: true
  write_file: ${VIBE_STATE_DIR}/frontend/__PROFILE_NAME__/opencode.json
  # MCP servers to wire into this profile. Each name resolves to
  # $XDG_CONFIG_HOME/vibe/mcp/<name>.yaml. Uncomment after dropping in
  # matching definitions:
  # mcps: [datadog]
  env:
    OPENCODE_CONFIG: ${WRITE_FILE}
  template:
    $schema: https://opencode.ai/config.json
    provider:
      vibe-local:
        npm: "@ai-sdk/openai-compatible"
        name: vibe (llama-server)
        options:
          baseURL: ${VIBE_API}
        models:
          ${MODEL_ALIAS}:
            name: ${MODEL_ALIAS}
            limit:
              context: ${MODEL_CONTEXT}
              output: 8192
    model: vibe-local/${MODEL_ALIAS}

# REPLACE: approximate VRAM the loaded model needs (used for future scheduling).
estimated_vram_gb: 16
