name: drift

# The alarm for the next v239 -> v247.
#
# ci.yml's conformance job runs against PINNED llama-swap versions, so it can
# never tell you that upstream moved. This one resolves LATEST at run time and
# runs the same conformance list against it. It is MEANT to be red: a red run
# means the contract changed, not that anybody's PR is broken, which is why it
# never touches the pull-request path.
#
# It carries no continue-on-error, and that is the whole point. A job-level
# continue-on-error makes the run CONCLUDE SUCCESS however the step went, so
# GitHub sends no notification for a scheduled run and the only way to learn
# that llama-swap broke the contract is to go and look at a tab nobody opens.
# An alarm that cannot ring is not an alarm. Red here costs nothing — no PR
# gates on this workflow — and it is the only automatic signal that arrives
# before a `docker compose pull` on the front arms the change.
#
# When it goes red:
#   1. Read the failing invariant — it names the semantic that moved.
#   2. Re-record: see internal/swaptest/record_test.go's TestRecord doc
#      comment. Commit the new fixtures/<version>/ BESIDE the existing ones.
#   3. Add the Wire to internal/swaptest and teach the fold the new shape.
#   4. Run scripts/upgrade/ritual.sh. This job tells you the contract moved;
#      only the ritual (conformance -> fleetlab -> the six-client SSE gate)
#      tells you what it does to a fleet, and only the digest pin on the
#      front decides when the fleet finds out.
#
# It costs the inner loop nothing.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  latest:
    name: conformance (llama-swap latest, unpinned)
    runs-on: ubuntu-latest
    env:
      LLAMA_CPP_VERSION: b10282
      MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: resolve llama-swap latest
        id: resolve
        run: |
          set -euo pipefail
          v=$(curl -sSfL https://api.github.com/repos/mostlygeek/llama-swap/releases/latest | \
                sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "llama-swap latest is $v"
      - name: report whether we have a recording for it
        run: |
          v="${{ steps.resolve.outputs.version }}"
          if [ -d "internal/swaptest/fixtures/$v" ]; then
            echo "internal/swaptest has recorded fixtures for $v."
          else
            echo "::warning::No recorded fixtures for llama-swap $v. If the conformance run below is red, re-record before upgrading any cell (see internal/swaptest TestRecord)."
          fi
      - name: fetch llama-swap latest + llama.cpp + a 1.2 MB model
        run: |
          set -euo pipefail
          mkdir -p .upstream
          v="${{ steps.resolve.outputs.version }}"
          curl -sSfL -o /tmp/ls.tgz \
            "https://github.com/mostlygeek/llama-swap/releases/download/${v}/llama-swap_${v#v}_linux_amd64.tar.gz"
          tar xzf /tmp/ls.tgz -C .upstream llama-swap
          curl -sSfL -o /tmp/lcpp.tgz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_VERSION}/llama-${LLAMA_CPP_VERSION}-bin-ubuntu-x64.tar.gz"
          rm -rf /tmp/lcpp && mkdir -p /tmp/lcpp && tar xzf /tmp/lcpp.tgz -C /tmp/lcpp
          # cp -a: the ggml libraries need their soname symlinks (see ci.yml).
          cp -a /tmp/lcpp/llama-*/. .upstream/
          curl -sSfL -o .upstream/stories260K.gguf "$MODEL_URL"
          chmod +x .upstream/llama-swap .upstream/llama-server
          export LD_LIBRARY_PATH="$PWD/.upstream"
          .upstream/llama-swap --version
          .upstream/llama-server --version
      - name: conformance against latest
        env:
          LLAMA_SWAP_BIN: ${{ github.workspace }}/.upstream/llama-swap
          LLAMA_SERVER_BIN: ${{ github.workspace }}/.upstream/llama-server
          LLAMA_GGUF: ${{ github.workspace }}/.upstream/stories260K.gguf
          LD_LIBRARY_PATH: ${{ github.workspace }}/.upstream
        # Same latent hole as ci.yml's conformance step, and worse here:
        # this leg's `-run` selects `TestSwapContract/live`, so with the
        # `env:` block above dropped there is no live target to match,
        # nothing is selected, and `go test` exits 0 having run ZERO
        # subtests. A green alarm that rang for nothing is the one failure
        # mode this whole workflow exists to avoid, so assert both halves.
        run: |
          set -euo pipefail
          go test -timeout 420s -v -run 'TestSwapContract/live|TestSwapBehaviour' ./internal/swaptest/ | tee /tmp/conformance.log
          grep -q 'TestSwapContract/live/exec' /tmp/conformance.log || {
            echo "no live/exec target ran: LLAMA_SWAP_BIN did not reach the test binary; only the double was verified" >&2
            exit 1
          }
          grep -q 'TestSwapBehaviour/B1' /tmp/conformance.log || {
            echo "TestSwapBehaviour did not run: the loading-state keepalive that every cold-start client depends on was not exercised" >&2
            exit 1
          }
