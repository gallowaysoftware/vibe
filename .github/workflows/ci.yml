name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: test (with race detector)
        run: go test -race -timeout 240s ./...
      - name: gofmt
        run: |
          out=$(gofmt -l . | tee /dev/stderr)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files (see above)" >&2
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # install.sh's BEHAVIOUR, as opposed to its text.
      #
      # internal/vibe/cli/install_sh_test.go greps the script for the shapes
      # that must be present (the version comparison, the three hashers, the
      # unverified() routing). This runs it: six `--dry-run` invocations that
      # assert the URL it builds, the idempotency skip and what --force does
      # to it. The two halves catch different things — a grep cannot tell you
      # the comparison compares the wrong two strings, which is exactly the
      # bug U7 fixed and this test now pins.
      #
      # It had never been executed against the current script. U7 (#69)
      # rewrote the comparison and updated this test's fake `vibe --version`
      # to the shape a goreleaser binary really prints, but running it was
      # forbidden while agents held the box, so the edit shipped unverified.
      # A test nobody runs is what this repo spent a week eliminating, so it
      # goes in the blocking job rather than into a habit.
      #
      # Safe on a runner, by construction rather than by luck: every one of
      # the six invocations passes --dry-run (which exits before mkdir,
      # download or install), pins VIBE_VERSION (so the GitHub API is never
      # called), and sets INSTALL_DIR under its own `mktemp -d`. It touches
      # neither ~/.local/bin nor the network. ~0.2s.
      - name: install.sh behaviour (POSIX, dry-run only)
        run: sh internal/install_test.sh

  # The mutation harness (fleet-control C20): internal/mutation's registry
  # of {production line, edit that breaks it, tests that must go red},
  # applied to a copy of the tree one entry at a time.
  #
  # It answers the repo owner's mandate directly — "add tests to catch this
  # stuff, relying on reviews for logic isn't working". Every adversarial
  # review in this plan has hand-verified guards exactly this way; the
  # registry is that table, run on every PR.
  #
  # A SEPARATE job for the same reason as the conformance matrix: each
  # entry is a package recompile, and the blocking `test` job's ~29s is an
  # asset. The two extra jobs run in parallel with it, so PR wall-clock is
  # set by whichever is slowest, not by the sum.
  #
  # HOW BIG IS IT: read the log, not this comment.
  #
  # The run prints its own sizing on the last line it emits —
  #
  #   SIZING: <n> entries, <w> workers, <t> wall, <p>% of the <T> -timeout
  #
  # — and reportBudget (internal/mutation/mutation_test.go) FAILS the job
  # once that share crosses two thirds. The bound is read from
  # t.Deadline(), which is the `-timeout` below rather than a copy of it,
  # so editing that flag moves the assertion with it.
  #
  # This is deliberately not a number. The number lived here three times
  # in two days and was wrong all three: "21s / 16 mutations", then "77
  # entries / 338-363s", then "97" while the registry was already at 123.
  # Every writer measured their own branch, the registry grew underneath
  # them, and each figure read as current. A reader cannot tell a fresh
  # measurement from a rotten one, so the job reports its own.
  #
  # What is durable, and is why 900s is the right flag rather than a
  # guess: the entries run WORKERS-wide (4), so wall time tracks the
  # worker count and the one-off baseline round far more than the entry
  # count. Measured across five registry sizes on one 32-core box, 59
  # extra entries cost 14 extra seconds — about a quarter-second each,
  # against a baseline round of ~30s. THIS RUNNER is slower by ~1.4x and
  # is the figure that matters, and it has run this job in the 5m40s-6m
  # range. So the job would have to roughly double before reportBudget
  # complains and roughly 2.5x before the flag truncates it — and it is
  # reportBudget, not a human reading a comment, that will say when that
  # stops being true. Leave `-timeout 900s` alone until it does.
  #
  # A timeout here is not a red guard, it is an unfinished one: `go test`
  # panics having verified an unknown prefix of the registry, which looks
  # exactly like a catch and is not one. That asymmetry is the whole
  # reason the ceiling is asserted below the wall rather than at it.
  #
  # TestMutationRegistryIsCurrent — the staleness half — costs milliseconds
  # and deliberately runs in the BLOCKING job instead, because an entry
  # that has come detached from the line it guards must be visible even on
  # a PR nobody waits for this job on.
  mutation:
    name: mutation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: mutation harness
        env:
          VIBE_MUTATION_TEST: "1"
        # The env gate is the whole job. Unset it — a rename, a typo, a
        # merge that drops the `env:` block — and every expensive test in
        # the package SKIPS, `go test` exits 0, and the job is green while
        # nothing was verified. This repo has already shipped one green
        # t.Skip standing in for a conformance invariant, which is why the
        # run has to prove it happened rather than merely not fail.
        # pipefail so tee cannot mask go test's own exit status.
        run: |
          set -euo pipefail
          go test -count=1 -timeout 900s -v ./internal/mutation/ | tee /tmp/mutation.log
          grep -q 'guards mutation-verified' /tmp/mutation.log || {
            echo "the mutation harness SKIPPED: VIBE_MUTATION_TEST did not reach the test binary, so this job verified nothing" >&2
            exit 1
          }
          # The sizing line the comment above points at, lifted out of a
          # 100-line -v log and into the step summary so it is READ. Its
          # own assertion already ran inside the test; this is only the
          # part a human would otherwise have to go looking for.
          sed -n 's/.*\(SIZING: .*\)/\1/p' /tmp/mutation.log | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

  # internal/swaptest's conformance list, run against a REAL llama-swap.
  #
  # TestSwapBehaviour rides along (fleet-control C16): the loading-state
  # keepalive and SIGTERM's treatment of in-flight streams are upstream
  # BEHAVIOURS no wire shape can express, and they are what
  # `vibe cell drain --wait` and every cold-start client depend on. ~40s.
  #
  # A SEPARATE job so the blocking `test` job's ~29s stays ~29s; the two run
  # in parallel, so PR wall-clock is unchanged.
  #
  # Both versions are exercised on purpose. v239 is what the fleet runs
  # today; v247 is what the next `go install` on any cell delivers, and the
  # in-flight frame shape changed between them in a way that silently
  # disarmed every busy guard in the fleet. "Both wires must pass" is the
  # requirement — a heterogeneous fleet is the normal state here.
  #
  # No container runtime and no new Go module: llama-swap ships a statically
  # linked 13 MB binary, llama.cpp ships a 16 MB CPU build, and stories260K
  # is a 1.2 MB GGUF that emits a full llama.cpp `timings` block — which is
  # what llama-swap parses into an activity row, so C7a's chat basis is
  # exercisable with no GPU and no model of consequence.
  conformance:
    name: conformance (llama-swap ${{ matrix.llama-swap }})
    runs-on: ubuntu-latest
    env:
      LLAMA_CPP_VERSION: b10282
      MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
    strategy:
      fail-fast: false
      matrix:
        # Bumping either pin is the documented trigger to re-record
        # internal/swaptest/fixtures/<version>/ — see TestRecord's doc
        # comment for the capture procedure.
        llama-swap: [v239, v247]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: cache upstream binaries
        uses: actions/cache@v4
        with:
          path: .upstream
          # Keyed on THIS FILE's hash as well as the versions. The first
          # attempt at this job cached a broken .upstream (see the fetch
          # step), and a version-only key then served that same broken copy
          # back to the run that fixed the bug. A cache whose key does not
          # cover the code that populates it can only be repaired by hand.
          key: upstream-${{ matrix.llama-swap }}-${{ env.LLAMA_CPP_VERSION }}-stories260K-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: fetch llama-swap + llama.cpp + a 1.2 MB model
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/.upstream"
          mkdir -p .upstream
          v="${{ matrix.llama-swap }}"
          # Presence is not usability. Test what actually broke — whether the
          # binary RUNS — so a poisoned cache repairs itself instead of being
          # trusted because the file exists.
          .upstream/llama-swap --version >/dev/null 2>&1 || {
            curl -sSfL -o /tmp/ls.tgz \
              "https://github.com/mostlygeek/llama-swap/releases/download/${v}/llama-swap_${v#v}_linux_amd64.tar.gz"
            tar xzf /tmp/ls.tgz -C .upstream llama-swap
          }
          .upstream/llama-server --version >/dev/null 2>&1 || {
            curl -sSfL -o /tmp/lcpp.tgz \
              "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_VERSION}/llama-${LLAMA_CPP_VERSION}-bin-ubuntu-x64.tar.gz"
            rm -rf /tmp/lcpp && mkdir -p /tmp/lcpp && tar xzf /tmp/lcpp.tgz -C /tmp/lcpp
            # cp -a the whole directory: the ggml libraries ship as versioned
            # sonames with SYMLINKS beside them (libggml.so.0 -> .0.18.1), and
            # a `find -type f` copy silently drops the symlinks. llama-server
            # then fails to load, llama-swap answers every completion 500, and
            # four of the five invariants pass anyway because they never need
            # an upstream. requireUpstreamServes is what makes that red.
            cp -a /tmp/lcpp/llama-*/. .upstream/
          }
          if [ ! -s .upstream/stories260K.gguf ]; then
            curl -sSfL -o .upstream/stories260K.gguf "$MODEL_URL"
          fi
          chmod +x .upstream/llama-swap .upstream/llama-server
          .upstream/llama-swap --version
          .upstream/llama-server --version
          du -sh .upstream
      - name: conformance
        env:
          LLAMA_SWAP_BIN: ${{ github.workspace }}/.upstream/llama-swap
          LLAMA_SERVER_BIN: ${{ github.workspace }}/.upstream/llama-server
          LLAMA_GGUF: ${{ github.workspace }}/.upstream/stories260K.gguf
          LD_LIBRARY_PATH: ${{ github.workspace }}/.upstream
        # The `env:` block above is the ENTIRE gate on the live target.
        # liveTarget() (internal/swaptest/live_test.go:44-50) returns
        # `false` when any one of the three is empty, `targets()` then
        # yields the doubles alone, and this step exits 0 with 16 green
        # fake-only subtests having exercised no llama-swap at all.
        #
        # That is precisely the exposure the mutation job thirty lines
        # above argues must be ASSERTED rather than assumed, and it was
        # left unasserted here. A rename, a typo, or a merge that drops
        # one line of `env:` is enough. So prove the live target ran.
        #
        # The assertion itself was then run BOTH ways on a workstation
        # (2026-08-09), because an assertion that cannot fail is the defect
        # it was added to prevent. With the three env vars dropped: `go
        # test` exits 0 over 18 green fake-only results, /tmp/conformance.log
        # carries no `live/exec` line, and the grep exits 1 — the step goes
        # red. With them present: `TestSwapContract/live/exec` and its seven
        # invariants run against a real llama-swap in 38.9s and the grep
        # exits 0.
        run: |
          set -euo pipefail
          go test -timeout 420s -v -run 'TestSwapContract|TestSwapBehaviour' ./internal/swaptest/ | tee /tmp/conformance.log
          grep -q 'TestSwapContract/live/exec' /tmp/conformance.log || {
            echo "no live/exec target ran: LLAMA_SWAP_BIN did not reach the test binary; only the double was verified" >&2
            exit 1
          }
