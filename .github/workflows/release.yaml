name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # goreleaser needs to create releases & upload artifacts.

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # goreleaser uses the full git history for changelogs.
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
